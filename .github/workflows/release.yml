name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishing (OIDC)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a publish mid-flight
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    if: github.repository == 'PowerLaunch/apier-python'   # fork-publish guard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Verify tag matches _version.py
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # Read the version file DIRECTLY (no package import needed; works
          # regardless of layout). The earlier draft tried `from src.apier import
          # _version`, which fails under src-layout because the installed module
          # is `apier`, not `src.apier`. This regex parse is layout-agnostic.
          PKG_VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/apier/_version.py').read_text()).group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION != _version.py $PKG_VERSION"; exit 1
          fi
          echo "OK tag $TAG_VERSION matches _version.py"
      - name: Install package + final test gate
        run: |
          python -m pip install -e ".[dev]"
          pytest --cov=src/apier --cov-fail-under=90
      - name: Build wheel + sdist
        run: python -m build
      - name: Surface secret-leak grep (wheel + sdist)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/audit && mkdir -p /tmp/audit
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C /tmp/audit; done
          for wheel in dist/*.whl; do unzip -q "$wheel" -d /tmp/audit; done
          if grep -rEn 'apier_(test|live)_[A-Za-z0-9_-]{16,}|Bearer [A-Za-z0-9._-]{20,}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]+|pypi-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9._-]{20,}' /tmp/audit/; then
            echo "::error::token-shaped string found in published surface"; exit 1
          fi
          echo "OK published surface clean"
      - name: Twine check
        run: twine check --strict dist/*
      - name: Publish to PyPI via Trusted Publishing (OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
